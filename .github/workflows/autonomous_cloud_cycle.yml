name: Nexus Autonomous Cloud Operating Cycle (24/7)

on:
  schedule:
    # Executes every 12 hours autonomously on GitHub Cloud Virtual Machines
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    name: Execute 24/7 Departmental Cycle & Learning Loop

    steps:
      - name: Checkout Autonomous Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Recursive Learning & Urgency Calibration Epoch
        run: |
          python scripts/recursive_optimizer.py

      - name: Execute Full Departmental Operating Cycle
        run: |
          python scripts/run_company_cycle.py

      - name: Commit & Push Updated Treasury Ledger, Signals, and Pulse
        run: |
          git config --global user.name "Nexus Cloud Orchestrator"
          git config --global user.email "cloud-orchestrator@nexusb2b.intel"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(cloud): autonomous cycle completed [skip ci]"
            git push
          fi
